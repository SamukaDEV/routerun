<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__VAR_TITLE__</title>
    <link rel="shortcut icon" href="data:image/svg+xml;base64,__VAR_FAVICON__" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0f1d;
            --bg-surface: #111827;
            --bg-card: #1e293b;
            --bg-card-hover: #26334d;
            --border-subtle: #334155;
            --border-highlight: #475569;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);

            /* Method Colors */
            --get-color: #10b981;
            --get-bg: rgba(16, 185, 129, 0.12);
            --get-border: rgba(16, 185, 129, 0.3);

            --post-color: #f59e0b;
            --post-bg: rgba(245, 158, 11, 0.12);
            --post-border: rgba(245, 158, 11, 0.3);

            --put-color: #8b5cf6;
            --put-bg: rgba(139, 92, 246, 0.12);
            --put-border: rgba(139, 92, 246, 0.3);

            --patch-color: #ec4899;
            --patch-bg: rgba(236, 72, 153, 0.12);
            --patch-border: rgba(236, 72, 153, 0.3);

            --delete-color: #ef4444;
            --delete-bg: rgba(239, 68, 68, 0.12);
            --delete-border: rgba(239, 68, 68, 0.3);

            --options-color: #06b6d4;
            --options-bg: rgba(6, 182, 212, 0.12);
            --options-border: rgba(6, 182, 212, 0.3);

            --head-color: #64748b;
            --head-bg: rgba(100, 116, 139, 0.12);
            --head-border: rgba(100, 116, 139, 0.3);

            --param-color: #38bdf8;
            --wildcard-color: #c084fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Glow */
        .ambient-glow {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 300px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(10, 15, 29, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 1.5rem;
        }

        .hidden {
            display: none !important;
        }

        .block {
            display: block !important;
        }

        .inline-flex {
            display: inline-flex !important;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-badge {
            background: #6366f1;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.25rem;
            color: #fff;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .header-titles h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .header-titles p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid var(--border-subtle);
            background-color: var(--bg-surface);
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--border-highlight);
            background-color: var(--bg-card);
            transform: translateY(-1px);
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            transition: border-color 0.2s ease;
        }

        .stat-card:hover {
            border-color: var(--border-highlight);
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-dim);
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: #fff;
            font-feature-settings: "tnum";
        }

        /* Controls Section (Search & Filters) */
        .controls-section {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .search-bar {
            display: flex;
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            pointer-events: none;
        }

        .filters-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .method-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-pill {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--border-subtle);
            background-color: var(--bg-base);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .filter-pill:hover {
            border-color: var(--border-highlight);
            color: #fff;
        }

        .filter-pill.active {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .pill-badge {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 0.1rem 0.4rem;
            border-radius: 10px;
            font-size: 0.65rem;
        }

        .routes-count-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Routes List */
        .routes-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .route-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1.25rem;
            transition: all 0.2s ease;
        }

        .route-card:hover {
            border-color: var(--border-highlight);
            background-color: var(--bg-card);
            transform: translateY(-1px);
        }

        /* Method Badges */
        .method-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            text-align: center;
            min-width: 80px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .method-badge.GET {
            color: var(--get-color);
            background-color: var(--get-bg);
            border: 1px solid var(--get-border);
        }

        .method-badge.POST {
            color: var(--post-color);
            background-color: var(--post-bg);
            border: 1px solid var(--post-border);
        }

        .method-badge.PUT {
            color: var(--put-color);
            background-color: var(--put-bg);
            border: 1px solid var(--put-border);
        }

        .method-badge.PATCH {
            color: var(--patch-color);
            background-color: var(--patch-bg);
            border: 1px solid var(--patch-border);
        }

        .method-badge.DELETE {
            color: var(--delete-color);
            background-color: var(--delete-bg);
            border: 1px solid var(--delete-border);
        }

        .method-badge.OPTIONS {
            color: var(--options-color);
            background-color: var(--options-bg);
            border: 1px solid var(--options-border);
        }

        .method-badge.HEAD {
            color: var(--head-color);
            background-color: var(--head-bg);
            border: 1px solid var(--head-border);
        }

        /* Route Content */
        .route-info {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 0;
        }

        .route-path-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .route-path {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 600;
            color: #f1f5f9;
            word-break: break-all;
        }

        .path-param {
            color: var(--param-color);
            font-weight: 600;
        }

        .path-wildcard {
            color: var(--wildcard-color);
            font-weight: 600;
        }

        .route-middlewares {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .mw-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 600;
        }

        .mw-pill {
            background-color: var(--bg-base);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }

        /* Route Actions */
        .route-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .action-btn {
            background-color: var(--bg-base);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            text-decoration: none;
        }

        .action-btn:hover {
            color: #fff;
            border-color: var(--border-highlight);
            background-color: var(--bg-surface);
        }

        .action-btn.copied {
            color: var(--get-color);
            border-color: var(--get-color);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--bg-surface);
            border: 1px dashed var(--border-subtle);
            border-radius: 12px;
            color: var(--text-muted);
        }

        .empty-state h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        /* Footer */
        footer {
            margin-top: auto;
            border-top: 1px solid var(--border-subtle);
            padding: 1.5rem 0;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .route-card {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            .route-actions {
                justify-content: flex-start;
            }
        }

        /* __VAR_CUSTOM_CSS__ */
    </style>
    <!-- __VAR_CUSTOM_HEADER__ -->
</head>

<body>
    <div class="ambient-glow"></div>
    <div class="container">
        <header>
            <div class="brand-container">
                <div class="logo-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-list-indent-increase-icon lucide-list-indent-increase">
                        <path d="M21 5H11" />
                        <path d="M21 12H11" />
                        <path d="M21 19H11" />
                        <path d="m3 8 4 4-4 4" />
                    </svg>
                </div>
                <div class="header-titles">
                    <h1>__VAR_TITLE__</h1>
                    <p>Interactive Route Inspector for RouteRun</p>
                </div>
            </div>
            <div class="header-actions">
                <a href="__VAR_BASEPATH__/json" target="_blank" class="btn __VAR_RAW_JSON__"
                    title="View routes as JSON payload">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-braces-icon lucide-braces">
                        <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1" />
                        <path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1" />
                    </svg>
                    Raw JSON
                </a>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Total Endpoints</span>
                <span class="stat-value" id="stat-total">__VAR_ROUTES_LENGTH__</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Unique Paths</span>
                <span class="stat-value" id="stat-paths">__VAR_UNIQUE_PATHS_SIZE__</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Middlewares Assigned</span>
                <span class="stat-value" id="stat-mw">__VAR_TOTAL_MIDDLEWARES__</span>
            </div>
        </div>

        <div class="controls-section">
            <div class="search-bar">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="route-search" class="search-input"
                    placeholder="Search by route path, param, or middleware name..." autocomplete="off">
            </div>
            <div class="filters-row">
                <div class="method-pills">
                    <button class="filter-pill active" data-method="ALL">ALL <span
                            class="pill-badge">__VAR_ROUTES_LENGTH__</span></button>
                    __VAR_BADGES__
                    <!-- ${Object.entries(methodCounts).map(([method, count]) => `
                    <button class="filter-pill" data-method="${method}">${method} <span
                            class="pill-badge">${count}</span></button>
                    `).join("")} -->
                </div>
                <div class="routes-count-label" id="routes-filtered-count">Showing __VAR_ROUTES_LENGTH__ routes</div>
            </div>
        </div>

        <div class="routes-container" id="routes-list">
            <!-- Rendered by client script -->
        </div>

        <footer>
            Built with <strong>RouteRun</strong> &bull; Fast, lightweight router for Bun
        </footer>
    </div>

    <script>
        const initialRoutes = []; // __VAR_JSON_ROUTES__;
        let selectedMethod = "ALL";
        let searchQuery = "";

        function formatPath(path) {
            return path.replace(/(:[a-zA-Z0-9_]+)/g, '<span class="path-param">$1</span>')
                .replace(/(\\*[\w]*)/g, '<span class="path-wildcard">$1</span>');
        }

        function renderRoutes() {
            const container = document.getElementById("routes-list");
            const countLabel = document.getElementById("routes-filtered-count");

            const filtered = initialRoutes.filter(r => {
                const matchMethod = selectedMethod === "ALL" || r.method.toUpperCase() === selectedMethod;
                const query = searchQuery.toLowerCase();
                const matchSearch = !query ||
                    r.path.toLowerCase().includes(query) ||
                    r.method.toLowerCase().includes(query) ||
                    (r.middlewares && r.middlewares.some(mw => mw.toLowerCase().includes(query)));
                return matchMethod && matchSearch;
            });

            countLabel.textContent = `Showing ${filtered.length} of ${initialRoutes.length} routes`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No routes found</h3>
                        <p>No endpoints match your current filter criteria.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((route, idx) => {
                const mwTags = (route.middlewares && route.middlewares.length > 0)
                    ? `<div class="route-middlewares">
                        <span class="mw-label">Middlewares:</span>
                        ${route.middlewares.map(mw => `<span class="mw-pill">${mw}</span>`).join("")}
                       </div>`
                    : "";

                const isGet = route.method.toUpperCase() === "GET" && !route.path.includes(":");
                const openBtn = isGet ? `
                    <a href="${route.path}" target="_blank" class="action-btn" title="Open in new tab">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        Open
                    </a>
                ` : "";

                return `
                    <div class="route-card" data-idx="${idx}">
                        <span class="method-badge ${route.method.toUpperCase()}">${route.method}</span>
                        <div class="route-info">
                            <div class="route-path-wrapper">
                                <span class="route-path">${formatPath(route.path)}</span>
                            </div>
                            ${mwTags}
                        </div>
                        <div class="route-actions">
                            <button class="action-btn" onclick="copyCurl('${route.method}', '${route.path}', this)" title="Copy cURL command">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                cURL
                            </button>
                            <button class="action-btn" onclick="copyPath('${route.path}', this)" title="Copy Path">
                                Copy
                            </button>
                            ${openBtn}
                        </div>
                    </div>
                `;
            }).join("");
        }

        function copyCurl(method, path, btn) {
            const origin = window.location.origin;
            const fullUrl = origin + (path.startsWith('/') ? path : '/' + path);
            let curl = `curl -X ${method} "${fullUrl}"`;
            if (method !== "GET" && method !== "HEAD") {
                curl += ` -H "Content-Type: application/json"`;
            }
            navigator.clipboard.writeText(curl);
            const orig = btn.innerHTML;
            btn.classList.add('copied');
            btn.textContent = 'Copied!';
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = orig;
            }, 1500);
        }

        function copyPath(path, btn) {
            navigator.clipboard.writeText(path);
            const orig = btn.innerHTML;
            btn.classList.add('copied');
            btn.textContent = 'Copied!';
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = orig;
            }, 1500);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Setup event listeners
        document.getElementById("route-search").addEventListener("input", (e) => {
            searchQuery = e.target.value;
            renderRoutes();
        });

        document.querySelectorAll(".filter-pill").forEach(pill => {
            pill.addEventListener("click", () => {
                document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
                pill.classList.add("active");
                selectedMethod = pill.getAttribute("data-method");
                renderRoutes();
            });
        });

        // Initial render
        renderRoutes();
    </script>
</body>

</html>
